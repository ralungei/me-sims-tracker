name: MySimsLife
options:
  bundleIdPrefix: com.mysims
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  knownRegions:
    - es
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: T6Q58Y6KX7
    CODE_SIGN_STYLE: Automatic

targets:
  MySimsLife:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MySimsLife
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: MySimsLife/MySimsLife.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.mysims.life
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
    info:
      path: MySimsLife/Info.plist
      properties:
        CFBundleDisplayName: "Livebars"
        CFBundleName: "Livebars"
        LSApplicationCategoryType: "public.app-category.lifestyle"
        # Declares we use only Apple's standard encryption (CloudKit,
        # iCloud KVS, HTTPS). No proprietary crypto → no export docs
        # required by App Store review.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysims.life
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  MySimsLife:
    build:
      targets:
        MySimsLife: all
    run:
      config: Debug
    archive:
      config: Release
